name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Linux jobs pin ubuntu-24.04: ubuntu-latest moved to 26.04, which has no Python 3.9, the oldest
# Python the plugins support. Revisit before GitHub retires 24.04.
jobs:
  custody-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the differential tests export released main (git merge-base HEAD origin/main)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Scanner unit tests (python 3.9, git required)
        env:
          CUSTODY_SLOW: "1"
          CUSTODY_REQUIRE_GIT: "1"
          CUSTODY_PERF_BUDGET_S: "60"
          CUSTODY_TIME_SLACK: "3"   # shared runners are loaded; the linearity bounds still catch quadratic paths
        run: python3 -m unittest discover -s custody-check/skills/custody-check/scripts -p '*_test.py' -v
      - name: IP grep (the giveaways must contain nothing from the paid method)
        # giveaway-only terms (custody-check, build-decisions, the decision-census pointer); the repo-wide paid-method words are the Method grep below.
        # The last three are the consolidation method, which stays paid: build-decisions diagnoses, it never teaches the fix.
        run: |
          # source only: the unit-test steps leave __pycache__ behind, and a .pyc is not shipped text
          if grep -rniE --binary-files=without-match --exclude-dir=__pycache__ \
               "routing table|office-hours|three-pillar|/review|/ship|map file|plan-before-build|decisions log" custody-check/ build-decisions/ decision-census/; then
            echo "paid-method vocabulary found in a giveaway plugin"; exit 1
          fi
      - name: Method grep (no published file ships the paid method's vocabulary)
        run: |
          # every tracked file except this one, which has to spell the words; the custody-check-only
          # terms stay in the IP grep above (prompt-coach's evals legitimately name /review).
          # Client names are checked by .githooks/pre-push from a list kept outside this repo.
          set +e
          git grep -niE "routing table|three-pillar|per-gate prompt|falsifier" -- . ':!.github/workflows/ci.yml'
          rc=$?
          set -e
          # git grep: 0 = found, 1 = clean, anything else = the check itself broke
          if [ $rc -eq 0 ]; then echo "paid-method vocabulary found in a published file"; exit 1; fi
          if [ $rc -ne 1 ]; then echo "method grep failed (exit $rc)"; exit 1; fi
      - name: Pre-push hook tests
        run: python3 -m unittest discover -s .githooks -p 'test_*.py' -v
      - name: Version guard (plugin.json must match __version__ and the marketplace entry)
        run: |
          check() {
            v=$(python3 -c "import json;print(json.load(open('$1/.claude-plugin/plugin.json'))['version'])")
            s=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('$2').read()).group(1))")
            m=$(python3 -c "import json;print([p['version'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins'] if p['name']=='$1'][0])")
            test "$v" = "$s" && test "$v" = "$m" || { echo "$1: plugin.json $v, __version__ $s, marketplace $m"; exit 1; }
          }
          check custody-check custody-check/skills/custody-check/scripts/custody_scan.py
          check build-decisions build-decisions/skills/build-decisions/scripts/census_scan.py
          # the decision-census pointer has no helper: plugin.json and the marketplace entry must agree
          v=$(python3 -c "import json;print(json.load(open('decision-census/.claude-plugin/plugin.json'))['version'])")
          m=$(python3 -c "import json;print([p['version'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins'] if p['name']=='decision-census'][0])")
          test "$v" = "$m" || { echo "decision-census: plugin.json $v, marketplace $m"; exit 1; }
      - name: Plugin validation (best effort; the CLI may not run headless here)
        id: validate
        continue-on-error: true
        run: |
          npm i -g --ignore-scripts @anthropic-ai/claude-code@2.1.273
          claude plugin validate --strict ./custody-check
          claude plugin validate --strict ./build-decisions
          claude plugin validate --strict ./decision-census
          claude plugin validate --strict ./spell-it-out
          claude plugin validate --strict .
      - name: Validation outcome
        run: |
          echo "claude plugin validate outcome: ${{ steps.validate.outcome }}"

  custody-check-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the differential tests export released main (git merge-base HEAD origin/main)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Scanner unit tests on Windows (informational until the first green run)
        env:
          CUSTODY_SLOW: "1"
          CUSTODY_PERF_BUDGET_S: "60"
          CUSTODY_TIME_SLACK: "3"
        run: python -m unittest discover -s custody-check/skills/custody-check/scripts -p "*_test.py"

  free-plugin-standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the never-worse differential reads origin/main's case.yaml files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: PyYAML for the differential (it parses case.yaml)
        run: python3 -m pip install pyyaml==6.0.2
      - name: Every free plugin's eval cases carry the shared graders, up to date
        run: python3 free-plugin-standard/sync_graders.py --check
      - name: Sync tests and never-worse-than-main differential on the saved reports
        run: python3 -m unittest discover -s free-plugin-standard -p '*_test.py' -v

  build-decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the differential test exports origin/main's helper with git archive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Helper unit tests and never-worse-than-main differential (python 3.9)
        env:
          CENSUS_SLOW: "1"
          CENSUS_TIME_SLACK: "3"   # shared runners are loaded; the linearity bounds still catch quadratic paths
        run: python3 -m unittest discover -s build-decisions/skills/build-decisions/scripts -p '*_test.py' -v
