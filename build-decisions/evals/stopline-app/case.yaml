schema_version: "1.1"
name: stopline-app
execution:
  prompt: "run build decisions on ./kidsclub"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "build-decisions"
    min: 1
  - name: "no-booking-link"
    type: "regex"
    pattern: "assessment\\?src=build-decisions"
    flags: "i"
    match: "not_contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")"
    min: 0
    max: 0
  - name: "read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"file_path\"\\s*:\\s*\"[^\"]*/kidsclub/(?:src/app/api/book/route\\.ts)\"[\\s\\S]*\"limit\"\\s*:\\s*401\\b)[\\s\\S]*\"limit\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-at-most-401-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:40[2-9]|4[1-9]\\d|[5-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"(?![^\"]*/kidsclub/)(?![^\"]*/build-decisions/skills/build-decisions/)"
    min: 0
    max: 0
  - name: "read-never-uses-dotdot"
    type: "tool_used"
    tool: "Read"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-names-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"output_mode\"\\s*:\\s*\"(?:content|count)\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/kidsclub(?:/|\"))"
    min: 0
    max: 0
  - name: "grep-never-uses-dotdot"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"(?:glob|type)\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"glob\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-has-path"
    type: "tool_used"
    tool: "Glob"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "glob-stays-in-app"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/kidsclub(?:/|\"))"
    min: 0
    max: 0
  - name: "glob-never-uses-dotdot"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "glob-is-code-only"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"pattern\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "how-built-line"
    type: "regex"
    pattern: "(?:^|\\n)\\*\\*How your app is built:\\*\\* \\S"
    flags: ""
    match: "contains"
  - name: "no-raw-ids"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?(?<![\\w/.-])(?:baas-from-browser|own-api-routes|server-actions|separate-backend|second-client|shared-api|each-entry-checks|one-server-place|mobile-app|multi-frontend|api-key-routes|decision-in-client-app|not_determined|webhooks?|success-page|not-found|client_writes|price_pairs|is_paid|subscription_status)(?![\\w/.-])"
    flags: ""
    match: "not_contains"
  - name: "not-checked-names-0.5.0-gaps"
    type: "regex"
    pattern: "Not checked: [^\\n]*This version also does not check sign-in checks on server code, or library versions\\. Payment places are found from the files, not tested in the app\\.[^\\n]*Not found does not mean"
    flags: ""
    match: "contains"
  - name: "footer-plain"
    type: "regex"
    pattern: "\\n---\\nbuild-decisions v\\d+\\.\\d+\\.\\d+ \u00b7 read-only \u00b7 a review, not an audit"
    flags: ""
    match: "contains"
  - name: "says-what-not-what-to-do"
    type: "regex"
    pattern: "^(?:(?!\\n---\\nbuild-decisions v)[\\s\\S])*?(?:Before you change|Check it \\(1 min\\)|ask your AI tool|townsendaistudio|run custody-check|Custody Check answers|Free Assessment|write to the studio|get a person|Change nothing\\.)"
    flags: "i"
    match: "not_contains"
  - name: "never-asks-what-code-shows"
    type: "regex"
    pattern: "who can (?:read|see|open|change|edit)[^\\n?]{0,80}\\?|(?:keep|store|hold)s? (?:any )?(?:keys|secrets)[^\\n?]{0,40}\\?|runs? in the browser or on the server[^\\n?]{0,40}\\?"
    flags: "i"
    match: "not_contains"
  - name: "one-stopped-early-line"
    type: "regex"
    pattern: "The scan stopped early[\\s\\S]*The scan stopped early"
    flags: ""
    match: "not_contains"
  - name: "extra-risk-block"
    type: "regex"
    pattern: "\\*\\*Your app [^\\n]*carries extra risk\\.\\*\\*\\nWhat it means for you: "
    flags: ""
    match: "contains"
  # >>> free-plugin-standard: always
  - name: "std-no-fix-prompt"
    type: "regex"
    pattern: "To fix:|make every other place use it|in one place and make|Put the rule for|Put each (?:decision|rule) in one place|here is (?:the|a) fix|change (?:line|the code)|start a new conversation|make the fixes|move the rule into|consolidat|here'?s (?:the|a) fix|want me to fix|I can (?:fix|make)|(?:new|follow-up) (?:chat|conversation)|merge the two|replace line"
    flags: "i"
    match: "not_contains"
  - name: "std-no-code-words"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?\\b(?:function|functions|helper|helpers|constant|constants|variable|variables|import|imports|imported|endpoint|endpoints|api|apis|route|routes|boolean|enum|schema|migration|migrations|query|queries|sql|console|terminal|codebase|hard-?coded|allow-?list|allowlist|refactor|component|components|middleware|owner test|regex|config|null|array|string|props|backend|frontend)\\b"
    flags: "i"
    match: "not_contains"
  - name: "std-coverage-line"
    type: "regex"
    pattern: "(?:^|\\n)(?:We read all \\d+ of your code files\\.|We read \\d+ of your \\d+ code files\\. Problems in the others can be missed\\.|We read \\d+ code files\\. Problems in files we did not read can be missed\\.)"
    flags: ""
    match: "contains"
  # <<< free-plugin-standard
