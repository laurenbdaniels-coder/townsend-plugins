schema_version: "1.1"
name: asks-stopline-first
# The host can ask (AskUserQuestion allowed), the code shows no stop-line field and the request does not
# answer it: the stop-line question comes first and ends with its two closing sentences (plan D1).
execution:
  prompt: "run build decisions on ./cartwheel"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill", "AskUserQuestion"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "build-decisions"
    min: 1
  - name: "asks-the-stop-line-question"
    type: "tool_used"
    tool: "AskUserQuestion"
    input_match: "card details[\\s\\S]*Don't know[\\s\\S]*stop_line: none"
    min: 1
    max: 1
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    max: 0
