schema_version: "1.1"
name: api-split
execution:
  prompt: "run build decisions on ./fieldnote"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "build-decisions"
    min: 1
  - name: "helper-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? 2>"
    min: 1
    max: 1
  - name: "section-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? --section architecture 2>"
    min: 1
    max: 1
  - name: "payment-section-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? --section payment 2>"
    min: 1
    max: 1
  - name: "three-shell-commands-at-most"
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 3
  - name: "does-not-say-nothing-found"
    type: "regex"
    pattern: "found no rule written"
    flags: "i"
    match: "not_contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|(?<!skipped )(?<!make sure )\\bnone\\b|make sure none\\b[^.\\n]*(?:duplicat|\\brules?\\b|\\bdecisions?\\b|more than one place|two places)"
    flags: "i"
    match: "not_contains"
  - name: "plain-english-sentences-25-words-max"
    type: "regex"
    pattern: "(?:[^\\s.!?:|\\n]+[ \\t]+){25,}[^\\s.!?:|\\n]+"
    flags: ""
    match: "not_contains"
  - name: "report-is-short"
    type: "regex"
    pattern: "# Build decisions[^\\n]*\\n(?:[^\\n]*\\n){0,50}build-decisions v"
    flags: "i"
    match: "contains"
  - name: "no-long-sections"
    type: "regex"
    pattern: "## Every place found|## What this can't tell you|## Two answers"
    flags: "i"
    match: "not_contains"
  - name: "says-what-was-not-checked"
    type: "regex"
    pattern: "Not checked: database settings[^\\n]*Not found does not mean"
    flags: "i"
    match: "contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")"
    min: 0
    max: 0
  - name: "read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"file_path\"\\s*:\\s*\"[^\"]*/fieldnote/(?:app/api/jobs/route\\.ts)\"[\\s\\S]*\"limit\"\\s*:\\s*401\\b)[\\s\\S]*\"limit\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-at-most-401-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:40[2-9]|4[1-9]\\d|[5-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"(?![^\"]*/fieldnote/)(?![^\"]*/build-decisions/skills/build-decisions/)"
    min: 0
    max: 0
  - name: "read-never-uses-dotdot"
    type: "tool_used"
    tool: "Read"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-names-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"output_mode\"\\s*:\\s*\"(?:content|count)\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/fieldnote(?:/|\"))"
    min: 0
    max: 0
  - name: "grep-never-uses-dotdot"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"(?:glob|type)\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"glob\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-has-path"
    type: "tool_used"
    tool: "Glob"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "glob-stays-in-app"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/fieldnote(?:/|\"))"
    min: 0
    max: 0
  - name: "glob-never-uses-dotdot"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "glob-is-code-only"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"pattern\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "no-unfilled-placeholders"
    type: "regex"
    pattern: "<[a-z][a-z0-9 ,\\'-]{2,60}>"
    flags: ""
    match: "not_contains"
  - name: "how-built-line"
    type: "regex"
    pattern: "(?:^|\\n)\\*\\*How your app is built:\\*\\* \\S"
    flags: ""
    match: "contains"
  - name: "no-raw-ids"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?(?<![\\w/.-])(?:baas-from-browser|own-api-routes|server-actions|separate-backend|second-client|shared-api|each-entry-checks|one-server-place|mobile-app|multi-frontend|api-key-routes|decision-in-client-app|not_determined|webhooks?|success-page|not-found|client_writes|price_pairs|is_paid|subscription_status)(?![\\w/.-])"
    flags: ""
    match: "not_contains"
  - name: "not-checked-names-0.5.0-gaps"
    type: "regex"
    pattern: "Not checked: [^\\n]*This version also does not check sign-in checks on server code, or library versions\\. Payment places are found from the files, not tested in the app\\.[^\\n]*Not found does not mean"
    flags: ""
    match: "contains"
  - name: "seat-price-in-the-phone-app"
    type: "regex"
    pattern: "(?:^|\\n)- [^\\n]*phone app[^\\n]*`[^`\\n]*mobile/src/Checkout\\.tsx:\\d+`"
    flags: "i"
    match: "contains"
  - name: "seat-price-on-the-web"
    type: "regex"
    pattern: "`[^`\\n]*src/lib/pricing\\.ts:\\d+`"
    flags: ""
    match: "contains"
  - name: "names-the-second-app"
    type: "regex"
    pattern: "\\*\\*How your app is built:\\*\\*[^\\n]*signs of a second app, such as a phone app, that uses the same data"
    flags: ""
    match: "contains"
  - name: "shared-data-risk-sentence"
    type: "regex"
    pattern: "If each app writes its own copy of a rule, the two apps can give different answers\\."
    flags: ""
    match: "contains"
  - name: "no-other-risk-sentence"
    type: "regex"
    pattern: "Anyone can send requests to that server code|So anyone using the app can change what a screen sends"
    flags: ""
    match: "not_contains"
  - name: "footer-plain"
    type: "regex"
    pattern: "\\n---\\nbuild-decisions v\\d+\\.\\d+\\.\\d+ \u00b7 read-only \u00b7 a review, not an audit"
    flags: ""
    match: "contains"
  - name: "first-sign-after-footer"
    type: "regex"
    pattern: "a review, not an audit[\\s\\S]*pick one thing you fixed"
    flags: "i"
    match: "contains"
  - name: "one-sign-at-a-time"
    type: "regex"
    pattern: "a review, not an audit[\\s\\S]*(?:Open two screens it did not mean to touch|where your app decides one price|Open two screens that show the same price)"
    flags: "i"
    match: "not_contains"
  - name: "nothing-of-the-report-after-footer"
    type: "regex"
    pattern: "a review, not an audit[\\s\\S]*(?:What it means for you:|Not checked:|Also worth a look|\\*\\*Your app has \\d)"
    flags: ""
    match: "not_contains"
  - name: "says-what-not-what-to-do"
    type: "regex"
    pattern: "^(?:(?!\\n---\\nbuild-decisions v)[\\s\\S])*?(?:Before you change|Check it \\(1 min\\)|ask your AI tool|townsendaistudio|run custody-check|Custody Check answers|Free Assessment|write to the studio|get a person|Change nothing\\.)"
    flags: "i"
    match: "not_contains"
  - name: "never-asks-what-code-shows"
    type: "regex"
    pattern: "who can (?:read|see|open|change|edit)[^\\n?]{0,80}\\?|(?:keep|store|hold)s? (?:any )?(?:keys|secrets)[^\\n?]{0,40}\\?|runs? in the browser or on the server[^\\n?]{0,40}\\?"
    flags: "i"
    match: "not_contains"
  - name: "one-stopped-early-line"
    type: "regex"
    pattern: "The scan stopped early[\\s\\S]*The scan stopped early"
    flags: ""
    match: "not_contains"
  # >>> free-plugin-standard: always issues
  - name: "std-no-fix-prompt"
    type: "regex"
    pattern: "To fix:|make every other place use it|in one place and make|Put the rule for|Put each (?:decision|rule) in one place|here is (?:the|a) fix|change (?:line|the code)|start a new conversation|make the fixes|move the rule into|consolidat|here'?s (?:the|a) fix|want me to fix|I can (?:fix|make)|(?:new|follow-up) (?:chat|conversation)|merge the two|replace line"
    flags: "i"
    match: "not_contains"
  - name: "std-no-code-words"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?\\b(?:function|functions|helper|helpers|constant|constants|variable|variables|import|imports|imported|endpoint|endpoints|api|apis|route|routes|boolean|enum|schema|migration|migrations|query|queries|sql|console|terminal|codebase|hard-?coded|allow-?list|allowlist|refactor|component|components|middleware|owner test|regex|config|null|array|string|props|backend|frontend)\\b"
    flags: "i"
    match: "not_contains"
  - name: "std-coverage-line"
    type: "regex"
    pattern: "(?:^|\\n)(?:We read all \\d+ of your code files\\.|We read \\d+ of your \\d+ code files\\. Problems in the others can be missed\\.|We read \\d+ code files\\. Problems in files we did not read can be missed\\.)"
    flags: ""
    match: "contains"
  - name: "std-count-line"
    type: "regex"
    pattern: "(?:^|\\n)\\*\\*Your app has \\d+ [^\\n*]+\\.\\*\\*[ \\t]*(?=\\n|$)"
    flags: ""
    match: "contains"
  - name: "std-why-it-matters"
    type: "regex"
    pattern: "Why this matters: "
    flags: ""
    match: "contains"
  - name: "std-out-of-sync"
    type: "regex"
    pattern: "What it means for you:"
    flags: ""
    match: "contains"
  # <<< free-plugin-standard
