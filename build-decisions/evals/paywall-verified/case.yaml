schema_version: "1.1"
name: paywall-verified
execution:
  prompt: "run build decisions on ./paywall-verified"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "build-decisions"
    min: 1
  - name: "helper-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? 2>"
    min: 1
    max: 1
  - name: "section-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? --section architecture 2>"
    min: 1
    max: 1
  - name: "payment-section-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py'? --repo '[^']*'? --section payment 2>"
    min: 1
    max: 1
  - name: "three-shell-commands-at-most"
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 3
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|(?<!skipped )(?<!make sure )\\bnone\\b|make sure none\\b[^.\\n]*(?:duplicat|\\brules?\\b|\\bdecisions?\\b|more than one place|two places)"
    flags: "i"
    match: "not_contains"
  - name: "plain-english-sentences-25-words-max"
    type: "regex"
    pattern: "(?:[^\\s.!?:|\\n]+[ \\t]+){25,}[^\\s.!?:|\\n]+"
    flags: ""
    match: "not_contains"
  - name: "report-is-short"
    type: "regex"
    pattern: "# Build decisions[^\\n]*\\n(?:[^\\n]*\\n){0,50}build-decisions v"
    flags: "i"
    match: "contains"
  - name: "no-long-sections"
    type: "regex"
    pattern: "## Every place found|## What this can't tell you|## Two answers"
    flags: "i"
    match: "not_contains"
  - name: "says-what-was-not-checked"
    type: "regex"
    pattern: "Not checked: database settings[^\\n]*Not found does not mean"
    flags: "i"
    match: "contains"
  - name: "points-to-custody-check"
    type: "regex"
    pattern: "run custody-check"
    flags: "i"
    match: "contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")"
    min: 0
    max: 0
  - name: "read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"(?![^\"]*/paywall-verified/)(?![^\"]*/build-decisions/skills/build-decisions/)"
    min: 0
    max: 0
  - name: "read-never-uses-dotdot"
    type: "tool_used"
    tool: "Read"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-names-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"output_mode\"\\s*:\\s*\"(?:content|count)\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/paywall-verified(?:/|\"))"
    min: 0
    max: 0
  - name: "grep-never-uses-dotdot"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"(?:glob|type)\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"glob\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-has-path"
    type: "tool_used"
    tool: "Glob"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "glob-stays-in-app"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/paywall-verified(?:/|\"))"
    min: 0
    max: 0
  - name: "glob-never-uses-dotdot"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "glob-is-code-only"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"pattern\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "no-unfilled-placeholders"
    type: "regex"
    pattern: "<[a-z][a-z0-9 ,\\'-]{2,60}>"
    flags: ""
    match: "not_contains"
  - name: "how-built-line"
    type: "regex"
    pattern: "(?:^|\\n)\\*\\*How your app is built:\\*\\* \\S"
    flags: ""
    match: "contains"
  - name: "no-raw-ids"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?(?<![\\w/.-])(?:baas-from-browser|own-api-routes|server-actions|separate-backend|second-client|shared-api|each-entry-checks|one-server-place|mobile-app|multi-frontend|api-key-routes|decision-in-client-app|not_determined|webhooks?|success-page|not-found|client_writes|price_pairs|is_paid|subscription_status)(?![\\w/.-])"
    flags: ""
    match: "not_contains"
  - name: "not-checked-names-0.5.0-gaps"
    type: "regex"
    pattern: "Not checked: [^\\n]*This version also does not check sign-in checks on server code, or library versions\\. Payment places are found from the files, not tested in the app\\.[^\\n]*Not found does not mean"
    flags: ""
    match: "contains"
  - name: "never-says-a-check-is-missing"
    type: "regex"
    pattern: "no sign that it checks"
    flags: "i"
    match: "not_contains"
  - name: "one-writer-is-not-a-rule-in-several-places"
    type: "regex"
    pattern: "Whether someone has paid\\*\\* \\(written in"
    flags: ""
    match: "not_contains"
  # >>> free-plugin-standard: always
  - name: "std-no-fix-prompt"
    type: "regex"
    pattern: "To fix:|make every other place use it|in one place and make|Put the rule for|Put each (?:decision|rule) in one place|here is (?:the|a) fix|change (?:line|the code)|start a new conversation|make the fixes|move the rule into|consolidat|here'?s (?:the|a) fix|want me to fix|I can (?:fix|make)|(?:new|follow-up) (?:chat|conversation)|merge the two|replace line"
    flags: "i"
    match: "not_contains"
  - name: "std-no-code-words"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?\\b(?:function|functions|helper|helpers|constant|constants|variable|variables|import|imports|imported|endpoint|endpoints|api|apis|route|routes|boolean|enum|schema|migration|migrations|query|queries|sql|console|terminal|codebase|hard-?coded|allow-?list|allowlist|refactor|component|components|middleware|owner test|regex|config|null|array|string|props|backend|frontend)\\b"
    flags: "i"
    match: "not_contains"
  # <<< free-plugin-standard
