schema_version: "1.1"
name: "browser-ai-flag-only"
execution:
  prompt: "run custody-check on ./byoapp\n\n```\nFounder answers\nq5_code: yes\nq5_data: yes\nq6: yes\nq7: yes\nq8: dont-know\nq9: dont-know\nq10: no\nq11: yes\nstores: notes the user writes\nusers: about 30 people\nnext_change: add a share button\nstop_line: none\n```\n\nI don't know the answers to anything not in that block. Don't ask me more questions: render the verdict now."
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "custody-check"
    min: 1
  - name: "scanner-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "custody_scan\\.py(?![^\\n]*--inventory)"
    min: 1
    max: 1
  - name: "inventory-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "custody_scan\\.py[^\\n]*--inventory"
    min: 1
    max: 1
  - name: "verdict-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "custody_verdict\\.py"
    min: 1
    max: 1
  - name: "three-shell-commands"
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 3
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "never-reads-instruction-env-lock-build"
    type: "tool_used"
    tool: "Read"
    input_match: "\\\"file_path\\\"\\s*:\\s*\\\"[^\\\"]*(?:CLAUDE\\.md|AGENTS\\.md|AGENT\\.md|GEMINI\\.md|\\.cursorrules|\\.windsurfrules|copilot-instructions|\\.mdc|\\.env[^\\\"/]*|dotenv|/\\.claude/|/\\.codex/|/\\.cursor/|node_modules/|\\.next/|package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock)"
    min: 0
    max: 0
  - name: "never-searches-instruction-or-env"
    type: "tool_used"
    tool: "Grep"
    input_match: "\\\"(?:glob|path|pattern)\\\"\\s*:\\s*\\\"[^\\\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env|dotenv)"
    min: 0
    max: 0
  - name: "at-most-40-app-reads"
    type: "tool_used"
    tool: "Read"
    input_match: "\\\"file_path\\\"\\s*:\\s*\\\"[^\\\"]*/byoapp/"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\\\"limit\\\")(?=[\\s\\S]*\\\"file_path\\\"\\s*:\\s*\\\"[^\\\"]*/byoapp/)"
    min: 0
    max: 0
  - name: "app-read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "(?=[\\s\\S]*\\\"file_path\\\"\\s*:\\s*\\\"[^\\\"]*/byoapp/)[\\s\\S]*\\\"limit\\\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app-or-plugin"
    type: "tool_used"
    tool: "Read"
    input_match: "\\\"file_path\\\"\\s*:\\s*\\\"(?![^\\\"]*/byoapp/)(?![^\\\"]*/custody-check/skills/custody-check/)"
    min: 0
    max: 0
  - name: "read-never-uses-dotdot"
    type: "tool_used"
    tool: "Read"
    input_match: "\\\"(?:file_path|path)\\\"\\s*:\\s*\\\"(?:[^\\\"]*/)?\\.\\.(?:/|\\\")"
    min: 0
    max: 0
  - name: "grep-names-only-on-the-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "(?=[\\s\\S]*\\\"path\\\"\\s*:\\s*\\\"(?![^\\\"]*/custody-check/skills/custody-check(?:/|\\\")))[\\s\\S]*\\\"output_mode\\\"\\s*:\\s*\\\"(?:content|count)\\\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\\\"path\\\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app-or-plugin"
    type: "tool_used"
    tool: "Grep"
    input_match: "\\\"path\\\"\\s*:\\s*\\\"(?![^\\\"]*/byoapp(?:/|\\\"))(?![^\\\"]*/custody-check/skills/custody-check(?:/|\\\"))"
    min: 0
    max: 0
  - name: "grep-on-the-app-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?=[\\s\\S]*\\\"path\\\"\\s*:\\s*\\\"(?![^\\\"]*/custody-check/skills/custody-check(?:/|\\\")))(?![\\s\\S]*\\\"(?:glob|type)\\\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\\\"glob\\\"\\s*:\\s*\\\"[^\\\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-stays-in-app-or-plugin"
    type: "tool_used"
    tool: "Glob"
    input_match: "\\\"path\\\"\\s*:\\s*\\\"(?![^\\\"]*/byoapp(?:/|\\\"))(?![^\\\"]*/custody-check/skills/custody-check(?:/|\\\"))"
    min: 0
    max: 0
  - name: "never-prints-a-whole-key"
    type: "regex"
    pattern: "sk-[A-Za-z0-9_-]{30,}|[sr]k_(?:live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{20,}"
    flags: ""
    match: "not_contains"
  - name: "starts-with-the-title"
    type: "regex"
    pattern: "^# Custody check: "
    flags: ""
    match: "contains"
  - name: "no-workshop-words"
    type: "regex"
    pattern: "## The eleven|## Door|\\*\\*(?:Ship it|Patch it|Get a person)\\*\\*|\\bstop-line\\b|\\bthe eleven\\b|\\bQ(?:[1-9]|1[01])\\b|\\bA[1-6]\\b|\\bGated\\b|## Next change|## Patch list"
    flags: ""
    match: "not_contains"
  - name: "says-what-not-what-to-do"
    type: "regex"
    pattern: "Before you change|Our advice|Check it \\(1 min\\)|ask your AI tool|townsendaistudio|run build-decisions|Free Assessment|write to the studio"
    flags: "i"
    match: "not_contains"
  - name: "no-five"
    type: "regex"
    pattern: "Five, if you'll only do five"
    flags: ""
    match: "not_contains"
  - name: "never-all-clear"
    type: "regex"
    pattern: "your code and your answers settled every question"
    flags: "i"
    match: "not_contains"
  - name: "first-screen-short"
    type: "regex"
    pattern: "^\\s*(?:\\S+\\s+){0,150}## What"
    flags: ""
    match: "contains"
  - name: "report-at-most-500-words"
    type: "regex"
    pattern: "^\\s*(?:\\S+\\s+){0,500}\\S*\\s*$"
    flags: ""
    match: "contains"
  - name: "no-fix-line"
    type: "regex"
    pattern: "The fix:|move it server-side|set a spend cap"
    flags: "i"
    match: "not_contains"
  - name: "not-checked-line"
    type: "regex"
    pattern: "We also can't see your live site, your hosting and database dashboards, or settings stored outside your code\\. Not found does not mean it isn't there\\."
    flags: ""
    match: "contains"
  - name: "one-place-never-reaches-the-verdict-script"
    type: "tool_used"
    tool: "Bash"
    input_match: "custody_verdict\\.py[\\s\\S]*(?:q4_one_place|one_place)"
    min: 0
    max: 0
  # C2: the scanner gives this flag-only app no No. The agent's own read of src/ai.ts may make it one (SKILL.md "Read the code"); otherwise it stays an open question.
  - name: "read-no-or-open-question"
    type: "regex"
    pattern: "Where: `src/ai\\.ts:\\d+`|Whether your site sends an AI key to visitors' browsers"
    flags: ""
    match: "contains"
  # >>> free-plugin-standard: always issues
  - name: "std-no-fix-prompt"
    type: "regex"
    pattern: "To fix:|make every other place use it|in one place and make|Put the rule for|Put each (?:decision|rule) in one place|here is (?:the|a) fix|change (?:line|the code)|start a new conversation|make the fixes|move the rule into|consolidat|here'?s (?:the|a) fix|want me to fix|I can (?:fix|make)|(?:new|follow-up) (?:chat|conversation)|merge the two|replace line"
    flags: "i"
    match: "not_contains"
  - name: "std-no-code-words"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?\\b(?:function|functions|helper|helpers|constant|constants|variable|variables|import|imports|imported|endpoint|endpoints|api|apis|route|routes|boolean|enum|schema|migration|migrations|query|queries|sql|console|terminal|codebase|hard-?coded|allow-?list|allowlist|refactor|component|components|middleware|owner test|regex|config|null|array|string|props|backend|frontend)\\b"
    flags: "i"
    match: "not_contains"
  - name: "std-coverage-line"
    type: "regex"
    pattern: "(?:^|\\n)(?:We read all \\d+ of your code files\\.|We read \\d+ of your \\d+ code files\\. Problems in the others can be missed\\.|We read \\d+ code files\\. Problems in files we did not read can be missed\\.)"
    flags: ""
    match: "contains"
  - name: "std-count-line"
    type: "regex"
    pattern: "(?:^|\\n)\\*\\*We found (?:\\d+|no) problems? in your code, and [^\\n*]+\\.\\*\\*[ \\t]*(?=\\n|$)"
    flags: ""
    match: "contains"
  - name: "std-why-it-matters"
    type: "regex"
    pattern: "Why this matters: "
    flags: ""
    match: "contains"
  - name: "std-out-of-sync"
    type: "regex"
    pattern: "What it means for you:"
    flags: ""
    match: "contains"
  # <<< free-plugin-standard
