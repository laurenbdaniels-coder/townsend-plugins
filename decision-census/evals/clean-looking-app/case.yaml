schema_version: "1.1"
name: clean-looking-app
execution:
  prompt: "run decision census on ./tidy-notes"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "helper-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py"
    min: 1
    max: 1
  - name: "says-not-found-by-this-run"
    type: "regex"
    pattern: "No decision was found in two places by this run"
    flags: "i"
    match: "contains"
  - name: "never-says-clean-or-only"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|\\bnone\\b|only one"
    flags: "i"
    match: "not_contains"
  - name: "plain-english-sentences-25-words-max"
    type: "regex"
    pattern: "(?:[^\\s.!?:|\\n]+[ \\t]+){25,}[^\\s.!?:|\\n]+"
    flags: ""
    match: "not_contains"
  - name: "report-is-short"
    type: "regex"
    pattern: "# Decision census[^\\n]*\\n(?:[^\\n]*\\n){0,36}Next:"
    flags: "i"
    match: "contains"
  - name: "no-long-sections"
    type: "regex"
    pattern: "## Every place found|## What this can't tell you|## Two answers"
    flags: "i"
    match: "not_contains"
  - name: "says-what-was-not-checked"
    type: "regex"
    pattern: "Not checked: database settings[^\\n]*Not found is not"
    flags: "i"
    match: "contains"
  - name: "points-to-custody-check"
    type: "regex"
    pattern: "run custody-check"
    flags: "i"
    match: "contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")"
    min: 0
    max: 0
  - name: "read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"(?![^\"]*/tidy-notes/)(?![^\"]*/decision-census/skills/decision-census/)"
    min: 0
    max: 0
  - name: "grep-names-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"output_mode\"\\s*:\\s*\"(?:content|count)\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/tidy-notes(?:/|\"))"
    min: 0
    max: 0
  - name: "grep-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"(?:glob|type)\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"glob\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-has-path"
    type: "tool_used"
    tool: "Glob"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "glob-stays-in-app"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/tidy-notes(?:/|\"))"
    min: 0
    max: 0
  - name: "glob-is-code-only"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"pattern\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
