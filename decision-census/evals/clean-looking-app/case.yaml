schema_version: "1.1"
name: clean-looking-app
execution:
  prompt: "run decision census on ./tidy-notes"
  max_turns: 40
  timeout_seconds: 900
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "helper-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py"
    min: 1
    max: 1
  - name: "says-not-found-by-this-run"
    type: "regex"
    pattern: "not found in two places by this run"
    flags: "i"
    match: "contains"
  - name: "never-says-clean-or-only"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|\\bnone\\b|only one"
    flags: "i"
    match: "not_contains"
  - name: "no-window-over-31-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:3[2-9]|[4-9]\\d|\\d{3,})"
    min: 0
    max: 0
  - name: "no-whole-file-read"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")[\\s\\S]*\"file_path\"\\s*:\\s*\"[^\"]*tidy-notes/"
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "plain-english-sentences-25-words-max"
    type: "regex"
    pattern: "(?:[^\\s.!?:|\\n]+[ \\t]+){25,}[^\\s.!?:|\\n]+"
    flags: ""
    match: "not_contains"
  - name: "context-line-up-top"
    type: "regex"
    pattern: "# Decision census[\\s\\S]{0,600}?A card means two places make the same decision"
    flags: "i"
    match: "contains"
