schema_version: "1.1"
name: seeded-app
execution:
  prompt: "run decision census on ./cartwheel"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "helper-ran-once"
    type: "tool_used"
    tool: "Bash"
    input_match: "census_scan\\.py"
    min: 1
    max: 1
  - name: "one-shell-command"
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 1
  - name: "visibility-pair-server"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/app/api/projects/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "visibility-pair-screen"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/components/ProjectList\\.tsx"
    flags: "i"
    match: "contains"
  - name: "price-pair-checkout"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/zz-checkout/plan\\.ts"
    flags: "i"
    match: "contains"
  - name: "price-pair-card"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/zz-pricing/PlanCard\\.tsx"
    flags: "i"
    match: "contains"
  - name: "paid-pair-access"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/lib/access\\.ts"
    flags: "i"
    match: "contains"
  - name: "paid-pair-export"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/app/api/export/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "rounding-pair-charge"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/lib/money\\.ts"
    flags: "i"
    match: "contains"
  - name: "rounding-pair-display"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/components/Total\\.tsx"
    flags: "i"
    match: "contains"
  - name: "by-hand-checks"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?:(?!Not checked:)[\\s\\S])*?Check \\(1 min\\)){4}"
    flags: "i"
    match: "contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|\\bnone\\b"
    flags: "i"
    match: "not_contains"
  - name: "plain-english-sentences-25-words-max"
    type: "regex"
    pattern: "(?:[^\\s.!?:|\\n]+[ \\t]+){25,}[^\\s.!?:|\\n]+"
    flags: ""
    match: "not_contains"
  - name: "report-is-short"
    type: "regex"
    pattern: "# Decision census[^\\n]*\\n(?:[^\\n]*\\n){0,34}Next:"
    flags: "i"
    match: "contains"
  - name: "no-long-sections"
    type: "regex"
    pattern: "## Every place found|## What this can't tell you|## Two answers"
    flags: "i"
    match: "not_contains"
  - name: "says-what-was-not-checked"
    type: "regex"
    pattern: "Not checked:[^\\n]*Not found is not"
    flags: "i"
    match: "contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "never-searches-inside-instruction-or-env-files"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
