schema_version: "1.1"
name: shared-constant-app
execution:
  prompt: "run decision census on ./teamdesk"
  max_turns: 40
  timeout_seconds: 900
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "real-price-pair-billing"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/config/billing\\.ts"
    flags: "i"
    match: "contains"
  - name: "real-price-pair-picker"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/components/SeatPicker\\.tsx"
    flags: "i"
    match: "contains"
  - name: "shared-list-not-carded-api"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/app/api/members/route\\.ts"
    flags: "i"
    match: "not_contains"
  - name: "shared-list-not-carded-form"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/components/InviteForm\\.tsx"
    flags: "i"
    match: "not_contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|\\bnone\\b"
    flags: "i"
    match: "not_contains"
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
