schema_version: "1.1"
name: shared-constant-app
execution:
  prompt: "run decision census on ./teamdesk"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "real-price-pair-billing"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/config/billing\\.ts"
    flags: "i"
    match: "contains"
  - name: "real-price-pair-picker"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/components/SeatPicker\\.tsx"
    flags: "i"
    match: "contains"
  - name: "shared-list-not-carded-api"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/app/api/members/route\\.ts"
    flags: "i"
    match: "not_contains"
  - name: "shared-list-not-carded-form"
    type: "regex"
    pattern: "(?:decisions? (?:is |are |was |were )?made in two places|No decision was found in two places by this run)(?:(?!Worth a look:|Not checked:)[\\s\\S])*src/components/InviteForm\\.tsx"
    flags: "i"
    match: "not_contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates|\\bnone\\b"
    flags: "i"
    match: "not_contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "never-searches-inside-instruction-or-env-files"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
