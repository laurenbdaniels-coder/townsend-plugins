schema_version: "1.1"
name: near-miss
execution:
  prompt: "review my PR and ship this branch"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
graders:
  - name: "census-does-not-fire"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 0
    max: 0
