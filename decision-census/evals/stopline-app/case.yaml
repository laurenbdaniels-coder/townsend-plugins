schema_version: "1.1"
name: stopline-app
execution:
  prompt: "run decision census on ./kidsclub"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "get-a-person"
    type: "regex"
    pattern: "Get a person"
    flags: "i"
    match: "contains"
  - name: "no-booking-link"
    type: "regex"
    pattern: "assessment\\?src=decision-census"
    flags: "i"
    match: "not_contains"
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
