schema_version: "1.1"
name: shared-helper-diverges
execution:
  prompt: "run decision census on ./planco"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "price-pair-page"
    type: "regex"
    pattern: "(?:^|\\n)- [^`\\n]*`[^`\\n]*src/app/pricing/page\\.tsx"
    flags: "i"
    match: "contains"
  - name: "price-pair-checkout"
    type: "regex"
    pattern: "(?:^|\\n)- [^`\\n]*`[^`\\n]*src/app/api/checkout/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "visibility-pair-api"
    type: "regex"
    pattern: "(?:^|\\n)- [^`\\n]*`[^`\\n]*src/app/api/projects/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "visibility-pair-list"
    type: "regex"
    pattern: "(?:^|\\n)- [^`\\n]*`[^`\\n]*src/components/ProjectList\\.tsx"
    flags: "i"
    match: "contains"
  - name: "does-not-say-nothing-found"
    type: "regex"
    pattern: "found no rule written"
    flags: "i"
    match: "not_contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates"
    flags: "i"
    match: "not_contains"
  - name: "at-most-40-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 40
  - name: "at-most-40-searches"
    type: "tool_used"
    tool: "Grep"
    min: 0
    max: 40
  - name: "at-most-10-globs"
    type: "tool_used"
    tool: "Glob"
    min: 0
    max: 10
  - name: "read-always-has-limit"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")"
    min: 0
    max: 0
  - name: "read-at-most-120-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:12[1-9]|1[3-9]\\d|[2-9]\\d\\d|\\d{4,})"
    min: 0
    max: 0
  - name: "read-stays-in-app"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"(?![^\"]*/planco/)(?![^\"]*/decision-census/skills/decision-census/)"
    min: 0
    max: 0
  - name: "read-never-uses-dotdot"
    type: "tool_used"
    tool: "Read"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-names-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"output_mode\"\\s*:\\s*\"(?:content|count)\""
    min: 0
    max: 0
  - name: "grep-has-path"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "grep-stays-in-app"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/planco(?:/|\"))"
    min: 0
    max: 0
  - name: "grep-never-uses-dotdot"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "grep-has-code-glob"
    type: "tool_used"
    tool: "Grep"
    input_match: "^(?![\\s\\S]*\"(?:glob|type)\")"
    min: 0
    max: 0
  - name: "grep-glob-is-code-only"
    type: "tool_used"
    tool: "Grep"
    input_match: "\"glob\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "glob-has-path"
    type: "tool_used"
    tool: "Glob"
    input_match: "^(?![\\s\\S]*\"path\")"
    min: 0
    max: 0
  - name: "glob-stays-in-app"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"path\"\\s*:\\s*\"(?![^\"]*/planco(?:/|\"))"
    min: 0
    max: 0
  - name: "glob-never-uses-dotdot"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"(?:file_path|path)\"\\s*:\\s*\"(?:[^\"]*/)?\\.\\.(?:/|\")"
    min: 0
    max: 0
  - name: "glob-is-code-only"
    type: "tool_used"
    tool: "Glob"
    input_match: "\"pattern\"\\s*:\\s*\"[^\"]*(?:CLAUDE|AGENTS|\\.env|\\.md|\\.mdc|\\.json|\\.ya?ml|\\.pem|cursorrules|\\.txt)"
    min: 0
    max: 0
  - name: "never-reads-instruction-or-env-files"
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*(?:CLAUDE\\.md|AGENTS\\.md|\\.env[^\"/]*|dotenv|\\.cursorrules)\""
    min: 0
    max: 0
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
  - name: "no-code-words-outside-paths"
    type: "regex"
    pattern: "(?:^|\\n)(?:[^`\\n]*`[^`\\n]*`)*[^`\\n]*?\\b(?:function|functions|helper|helpers|constant|constants|variable|variables|import|imports|imported|endpoint|endpoints|api|apis|route|routes|boolean|enum|schema|migration|migrations|query|queries|sql|console|terminal|codebase|hard-?coded|allow-?list|allowlist|refactor|component|components|middleware|owner test|regex|config|null|array|string|props|backend|frontend)\\b"
    flags: "i"
    match: "not_contains"
  - name: "headline-count"
    type: "regex"
    pattern: "Your app has \\d+ rules? that (?:is|are) written in more than one place"
    flags: ""
    match: "contains"
  - name: "says-why-it-matters"
    type: "regex"
    pattern: "Why this matters: "
    flags: ""
    match: "contains"
  - name: "says-what-goes-wrong"
    type: "regex"
    pattern: "If they get out of sync:"
    flags: ""
    match: "contains"
  - name: "gives-a-fix-prompt"
    type: "regex"
    pattern: "To fix:"
    flags: ""
    match: "contains"
