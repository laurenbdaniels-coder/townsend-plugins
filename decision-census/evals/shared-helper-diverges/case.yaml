schema_version: "1.1"
name: shared-helper-diverges
execution:
  prompt: "run decision census on ./planco"
  max_turns: 40
  timeout_seconds: 900
context:
  scaffold_script: scaffold.sh
graders:
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    input_match: "decision-census"
    min: 1
  - name: "price-pair-page"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/app/pricing/page\\.tsx"
    flags: "i"
    match: "contains"
  - name: "price-pair-checkout"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/app/api/checkout/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "visibility-pair-api"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/app/api/projects/route\\.ts"
    flags: "i"
    match: "contains"
  - name: "visibility-pair-list"
    type: "regex"
    pattern: "## Two answers\\?(?:(?!## Every place found)[\\s\\S])*src/components/ProjectList\\.tsx"
    flags: "i"
    match: "contains"
  - name: "never-says-clean"
    type: "regex"
    pattern: "\\bclean\\b|no duplicates"
    flags: "i"
    match: "not_contains"
  - name: "no-window-over-31-lines"
    type: "tool_used"
    tool: "Read"
    input_match: "\"limit\"\\s*:\\s*(?:3[2-9]|[4-9]\\d|\\d{3,})"
    min: 0
    max: 0
  - name: "no-whole-file-read"
    type: "tool_used"
    tool: "Read"
    input_match: "^(?![\\s\\S]*\"limit\")[\\s\\S]*\"file_path\"\\s*:\\s*\"[^\"]*/(?:planco|teamdesk)/"
    min: 0
    max: 0
  - name: "at-most-26-reads"
    type: "tool_used"
    tool: "Read"
    min: 0
    max: 26
  - name: "no-edit"
    type: "tool_used"
    tool: "Edit"
    min: 0
    max: 0
  - name: "no-write"
    type: "tool_used"
    tool: "Write"
    min: 0
    max: 0
